<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugimoto Content Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
header{background:#fff;border-bottom:1px solid #e5e5e5;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:1rem;font-weight:600;color:#5b4fe9}.logo small{color:#888;font-weight:400;font-size:0.8rem;margin-right:6px}
main{max-width:860px;margin:0 auto;padding:20px}
.steps{display:flex;border-radius:8px;overflow:hidden;border:1px solid #e5e5e5;margin-bottom:18px}
.step{flex:1;padding:10px;font-size:0.78rem;color:#888;background:#fff;text-align:center;border-left:1px solid #e5e5e5}
.step:first-child{border-left:none}
.step.active{background:#eef0ff;color:#5b4fe9;font-weight:500}
.step.done{background:#e8f5e9;color:#2e7d32}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:18px;margin-bottom:14px}
.card-title{font-size:0.88rem;font-weight:600;margin-bottom:12px;color:#333}
.sec-label{font-size:0.73rem;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.topics-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:500px){.topics-grid{grid-template-columns:1fr}}
.topic{padding:10px 11px;background:#fafafa;border:1.5px solid #e5e5e5;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:0.83rem;transition:all 0.15s;user-select:none}
.topic:hover{border-color:#999}
.topic.sel-ca{border-color:#e53935;background:#fff5f5}
.topic.sel-eu{border-color:#1e88e5;background:#f0f6ff}
.chk{width:15px;height:15px;border-radius:4px;border:1.5px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.68rem}
.sel-ca .chk{background:#e53935;border-color:#e53935;color:#fff}
.sel-eu .chk{background:#1e88e5;border-color:#1e88e5;color:#fff}
.row{display:flex;gap:7px;margin-top:10px}
.inp{flex:1;padding:9px 11px;background:#fafafa;border:1px solid #ddd;border-radius:8px;color:#333;font-size:0.83rem;font-family:inherit}
.inp:focus{outline:none;border-color:#5b4fe9}
.sel-info{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#f8f8f8;border-radius:8px;margin-top:10px;font-size:0.8rem;color:#666}
.sel-count{color:#5b4fe9;font-weight:600}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:0.85rem;font-family:inherit}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.btn-primary{background:#5b4fe9;color:#fff;font-weight:500}
.btn-primary:not(:disabled):hover{background:#4a3fd8}
.btn-sec{background:#fff;border:1px solid #ddd;color:#555}
.btn-sec:hover{border-color:#999}
.btn-copy{background:#fff;border:1px solid #ddd;color:#555;padding:7px 12px;font-size:0.78rem}
.btn-copy-all{background:#5b4fe9;color:#fff;border:none;padding:7px 14px;font-size:0.78rem}
.carousel-wrap{background:#fff;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;margin-bottom:12px}
.carousel-head{padding:11px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;background:#fafafa}
.carousel-title{font-size:0.86rem;font-weight:600;color:#333}
.carousel-body{padding:15px}
.slide{border-right:2.5px solid #5b4fe9;padding:8px 11px;margin-bottom:7px;background:#f9f8ff;border-radius:0 6px 6px 0;font-size:0.81rem;line-height:1.75;white-space:pre-wrap;color:#333}
.slide-n{font-size:0.68rem;color:#5b4fe9;font-weight:600;margin-bottom:2px}
.cap{background:#f0f4ff;border:1px solid #c7d2fe;border-radius:8px;padding:11px;margin-top:9px;font-size:0.81rem;line-height:1.75;white-space:pre-wrap;color:#333}
.cap-label{font-size:0.68rem;color:#5b4fe9;font-weight:600;margin-bottom:3px}
.carousel-actions{padding:9px 15px;border-top:1px solid #f0f0f0;display:flex;gap:7px;flex-wrap:wrap}
.badge{font-size:0.69rem;padding:2px 8px;border-radius:20px;font-weight:600}
.badge-ca{background:#ffebee;color:#c62828}
.badge-eu{background:#e3f2fd;color:#1565c0}
.loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading.on{display:flex}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{color:#fff;font-size:0.85rem;background:rgba(0,0,0,0.5);padding:7px 14px;border-radius:8px;text-align:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(55px);background:#333;color:#fff;border-radius:8px;padding:9px 16px;font-size:0.82rem;transition:transform 0.25s;z-index:200}
.toast.on{transform:translateX(-50%) translateY(0)}
.err{color:#c62828;background:#ffebee;border:1px solid #ef9a9a;border-radius:8px;padding:9px 12px;font-size:0.8rem}
.divider{display:flex;align-items:center;gap:10px;color:#bbb;font-size:0.75rem;margin:12px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e5e5}
</style>
</head>
