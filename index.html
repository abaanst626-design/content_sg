<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugimoto Content Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
header{background:#fff;border-bottom:1px solid #e5e5e5;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:1rem;font-weight:600;color:#5b4fe9}.logo small{color:#888;font-weight:400;font-size:0.8rem;margin-right:6px}
main{max-width:860px;margin:0 auto;padding:20px}
.steps{display:flex;border-radius:8px;overflow:hidden;border:1px solid #e5e5e5;margin-bottom:18px}
.step{flex:1;padding:10px;font-size:0.78rem;color:#888;background:#fff;text-align:center;border-left:1px solid #e5e5e5}
.step:first-child{border-left:none}
.step.active{background:#eef0ff;color:#5b4fe9;font-weight:500}
.step.done{background:#e8f5e9;color:#2e7d32}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:18px;margin-bottom:14px}
.card-title{font-size:0.88rem;font-weight:600;margin-bottom:12px;color:#333}
.sec-label{font-size:0.73rem;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.topics-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:500px){.topics-grid{grid-template-columns:1fr}}
.topic{padding:10px 11px;background:#fafafa;border:1.5px solid #e5e5e5;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:0.83rem;transition:all 0.15s;user-select:none}
.topic:hover{border-color:#999}
.topic.sel-ca{border-color:#e53935;background:#fff5f5}
.topic.sel-eu{border-color:#1e88e5;background:#f0f6ff}
.chk{width:15px;height:15px;border-radius:4px;border:1.5px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.68rem}
.sel-ca .chk{background:#e53935;border-color:#e53935;color:#fff}
.sel-eu .chk{background:#1e88e5;border-color:#1e88e5;color:#fff}
.row{display:flex;gap:7px;margin-top:10px}
.inp{flex:1;padding:9px 11px;background:#fafafa;border:1px solid #ddd;border-radius:8px;color:#333;font-size:0.83rem;font-family:inherit}
.inp:focus{outline:none;border-color:#5b4fe9}
.sel-info{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#f8f8f8;border-radius:8px;margin-top:10px;font-size:0.8rem;color:#666}
.sel-count{color:#5b4fe9;font-weight:600}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:0.85rem;font-family:inherit}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.btn-primary{background:#5b4fe9;color:#fff;font-weight:500}
.btn-primary:not(:disabled):hover{background:#4a3fd8}
.btn-sec{background:#fff;border:1px solid #ddd;color:#555}
.btn-sec:hover{border-color:#999}
.btn-copy{background:#fff;border:1px solid #ddd;color:#555;padding:7px 12px;font-size:0.78rem}
.btn-copy-all{background:#5b4fe9;color:#fff;border:none;padding:7px 14px;font-size:0.78rem}
.carousel-wrap{background:#fff;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;margin-bottom:12px}
.carousel-head{padding:11px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;background:#fafafa}
.carousel-title{font-size:0.86rem;font-weight:600;color:#333}
.carousel-body{padding:15px}
.slide{border-right:2.5px solid #5b4fe9;padding:8px 11px;margin-bottom:7px;background:#f9f8ff;border-radius:0 6px 6px 0;font-size:0.81rem;line-height:1.75;white-space:pre-wrap;color:#333}
.slide-n{font-size:0.68rem;color:#5b4fe9;font-weight:600;margin-bottom:2px}
.cap{background:#f0f4ff;border:1px solid #c7d2fe;border-radius:8px;padding:11px;margin-top:9px;font-size:0.81rem;line-height:1.75;white-space:pre-wrap;color:#333}
.cap-label{font-size:0.68rem;color:#5b4fe9;font-weight:600;margin-bottom:3px}
.carousel-actions{padding:9px 15px;border-top:1px solid #f0f0f0;display:flex;gap:7px;flex-wrap:wrap}
.badge{font-size:0.69rem;padding:2px 8px;border-radius:20px;font-weight:600}
.badge-ca{background:#ffebee;color:#c62828}
.badge-eu{background:#e3f2fd;color:#1565c0}
.loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading.on{display:flex}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{color:#fff;font-size:0.85rem;background:rgba(0,0,0,0.5);padding:7px 14px;border-radius:8px;text-align:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(55px);background:#333;color:#fff;border-radius:8px;padding:9px 16px;font-size:0.82rem;transition:transform 0.25s;z-index:200}
.toast.on{transform:translateX(-50%) translateY(0)}
.err{color:#c62828;background:#ffebee;border:1px solid #ef9a9a;border-radius:8px;padding:9px 12px;font-size:0.8rem}
.divider{display:flex;align-items:center;gap:10px;color:#bbb;font-size:0.75rem;margin:12px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e5e5}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="load-txt" id="loadTxt">در حال تولید...</div>
</div>
<div class="toast" id="toast"></div>
<header>
  <div class="logo">Sugimoto <small>Content Hub</small></div>
  <span id="keyStatus" style="font-size:0.73rem;color:#4caf50"></span>
</header>
<main>
  <div class="steps">
    <div class="step active" id="s1">۱. انتخاب موضوع</div>
    <div class="step" id="s2">۲. تولید محتوا</div>
    <div class="step" id="s3">۳. کپی و استفاده</div>
  </div>
  <div id="step1">
    <div class="card">
      <div class="card-title">کلید Gemini API</div>
      <div class="row">
        <input class="inp" type="password" id="apiKey" placeholder="AIza..." />
        <button class="btn btn-primary" onclick="saveKey()">ذخیره</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">موضوعات پیشنهادی</div>
      <div class="sec-label" style="color:#c62828">🇨🇦 کانادا</div>
      <div class="topics-grid" id="caGrid"></div>
      <div class="sec-label" style="margin-top:13px;color:#1565c0">🇪🇺 اروپا</div>
      <div class="topics-grid" id="euGrid"></div>
      <div class="divider">یا موضوع دلخواه وارد کنید</div>
      <div class="row">
        <input class="inp" type="text" id="customInp" placeholder="مثال: شهریه دانشگاه‌های هلند ۲۰۲۷" />
        <button class="btn btn-sec" onclick="addCustom()">+ اضافه</button>
      </div>
      <div class="sel-info">
        <span id="selLbl" style="color:#888">موضوعی انتخاب نشده</span>
        <span class="sel-count" id="selCnt">۰ / ۵</span>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="genBtn" onclick="generate()" disabled>تولید کاروسل</button>
        <button class="btn btn-sec" onclick="refresh()">موضوعات جدید</button>
      </div>
    </div>
  </div>
  <div id="step23" style="display:none">
    <div id="results"></div>
    <button class="btn btn-sec" onclick="back()" style="margin-top:4px">← موضوعات جدید</button>
  </div>
</main>
<script>
var caData=[{id:'ca1',text:'مسیر Express Entry کانادا ۲۰۲۶',type:'ca'},{id:'ca2',text:'برنامه BC PNP - استریم جدید',type:'ca'},{id:'ca3',text:'استارتاپ البرتا برای فارغ‌التحصیلان',type:'ca'},{id:'ca4',text:'ویزای تحصیلی کانادا - تغییرات ۲۰۲۶',type:'ca'},{id:'ca5',text:'کارآفرینی استانی بریتیش کلمبیا',type:'ca'}]
var euData=[{id:'eu1',text:'استارتاپ ویزای هلند ۲۰۲۶',type:'eu'},{id:'eu2',text:'شهریه و تمکن مالی اسپانیا ۲۰۲۷',type:'eu'},{id:'eu3',text:'بورسیه‌های فنلاند برای ارشد',type:'eu'},{id:'eu4',text:'ویزای دانشجویی آلمان - مسیر کامل',type:'eu'},{id:'eu5',text:'تحصیل در فرانسه - کالج و ارشد ۲۰۲۷',type:'eu'}]
var sel=new Set(),results=[]
window.onload=function(){var k=localStorage.getItem('gk');if(k){document.getElementById('apiKey').value=k;document.getElementById('keyStatus').textContent='● API آماده'}render()}
function saveKey(){var k=document.getElementById('apiKey').value.trim();if(!k)return showToast('API Key را وارد کنید');localStorage.setItem('gk',k);document.getElementById('keyStatus').textContent='● API آماده';showToast('✓ ذخیره شد');updateBtn()}
function render(){document.getElementById('caGrid').innerHTML=caData.map(topicHTML).join('');document.getElementById('euGrid').innerHTML=euData.map(topicHTML).join('');updateSel()}
function topicHTML(t){var cls=sel.has(t.id)?(t.type==='ca'?'sel-ca':'sel-eu'):'';var chk=sel.has(t.id)?'✓':'';return '<div class="topic '+cls+'" onclick="toggle(\''+t.id+'\')"><div class="chk">'+chk+'</div><span>'+t.text+'</span></div>'}
function toggle(id){if(sel.has(id)){sel.delete(id)}else{if(sel.size>=5){showToast('حداکثر ۵ موضوع');return}sel.add(id)}render()}
function updateSel(){var n=sel.size;document.getElementById('selLbl').textContent=n===0?'موضوعی انتخاب نشده':n+' موضوع انتخاب شده';document.getElementById('selCnt').textContent=n+' / ۵';updateBtn()}
function updateBtn(){var k=document.getElementById('apiKey').value.trim();document.getElementById('genBtn').disabled=!(sel.size>0&&k.length>10)}
function addCustom(){var inp=document.getElementById('customInp');var text=inp.value.trim();if(!text)return showToast('موضوع را بنویسید');var id='c'+Date.now();caData.push({id:id,text:text,type:'ca'});sel.add(id);inp.value='';render();showToast('✓ اضافه شد')}
function refresh(){sel.clear();caData.sort(function(){return Math.random()-0.5});euData.sort(function(){return Math.random()-0.5});render();showToast('موضوعات جدید شدند')}
async function generate(){var k=document.getElementById('apiKey').value.trim();if(!k)return showToast('API Key را وارد کنید');if(sel.size===0)return showToast('موضوعی انتخاب نشده');var all=caData.concat(euData);var topics=all.filter(function(t){return sel.has(t.id)});document.getElementById('results').innerHTML='';results=[];setStep(2);document.getElementById('step1').style.display='none';document.getElementById('step23').style.display='block';for(var i=0;i<topics.length;i++){var t=topics[i];setLoading(true,'کاروسل '+(i+1)+' از '+topics.length+': '+t.text);try{var out=await callGemini(k,t);results.push(Object.assign({topic:t},out));addCarousel(t,out,results.length-1)}catch(e){addError(t,e.message)}}setLoading(false);setStep(3)}
async function callGemini(key,topic){var country=topic.type==='ca'?'کانادا 🇨🇦':'اروپا 🇪🇺';var prompt='تو متخصص تولید محتوای مهاجرت و تحصیل خارج هستی.\n\nموضوع: '+topic.text+'\nمنطقه: '+country+'\n\nیک کاروسل اینستاگرام ۱۰-۱۲ اسلایدی با این ساختار بنویس:\n\n===SLIDE_1===\nتیتر جذاب و سوالی + ایموجی پرچم + دعوت ذخیره\n\n===SLIDE_2===\nزمینه و اهمیت موضوع\n\n===SLIDE_3===\nشرایط اصلی با بولت و ایموجی\n\n===SLIDE_4===\nجزئیات مهم ۱\n\n===SLIDE_5===\nجزئیات مهم ۲\n\n===SLIDE_6===\nجزئیات مهم ۳\n\n===SLIDE_7===\nجزئیات مهم ۴\n\n===SLIDE_8===\nجزئیات مهم ۵\n\n===SLIDE_9===\nجدول مقایسه\n\n===SLIDE_10===\nنقشه راه\n\n===SLIDE_11===\nCTA\n\n===CAPTION===\nکپشن اینستاگرام\n\nفقط همین ساختار.';var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:3000,temperature:0.8}})});if(!res.ok){var e=await res.json();throw new Error(e.error&&e.error.message?e.error.message:'خطای API: '+res.status)}var data=await res.json();var text=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]&&data.candidates[0].content.parts[0].text)||'';return parseOutput(text)}
function parseOutput(text){var slides=[];var re=/===SLIDE_(\d+)===([\s\S]*?)(?====SLIDE_\d+===|===CAPTION===|$)/g;var m;while((m=re.exec(text))!==null){slides.push({n:+m[1],content:m[2].trim()})}var cm=text.match(/===CAPTION===([\s\S]*)$/);return{slides:slides,caption:cm?cm[1].trim():''}}
function addCarousel(topic,out,idx){var badge=topic.type==='ca'?'<span class="badge badge-ca">🇨🇦 کانادا</span>':'<span class="badge badge-eu">🇪🇺 اروپا</span>';var slidesHTML=out.slides.map(function(s){return'<div class="slide"><div class="slide-n">اسلاید '+s.n+'</div>'+esc(s.content)+'</div>'}).join('');var capHTML=out.caption?'<div class="cap"><div class="cap-label">کپشن</div>'+esc(out.caption)+'</div>':'';var div=document.createElement('div');div.className='carousel-wrap';div.innerHTML='<div class="carousel-head"><span class="carousel-title">'+topic.text+'</span>'+badge+'</div><div class="carousel-body">'+slidesHTML+capHTML+'</div><div class="carousel-actions"><button class="btn btn-copy" onclick="copySlides('+idx+')">کپی اسلایدها</button><button class="btn btn-copy" onclick="copyCaption('+idx+')">کپی کپشن</button><button class="btn btn-copy-all" onclick="copyAll('+idx+')">کپی همه</button></div>';document.getElementById('results').appendChild(div)}
function addError(topic,msg){var div=document.createElement('div');div.className='carousel-wrap';div.innerHTML='<div class="carousel-head"><span class="carousel-title" style="color:#c62828">خطا: '+topic.text+'</span></div><div class="carousel-body"><div class="err">'+msg+'</div></div>';document.getElementById('results').appendChild(div)}
function copySlides(i){var c=results[i];if(!c)return;cp(c.slides.map(function(s){return'--- اسلاید '+s.n+' ---\n'+s.content}).join('\n\n'));showToast('✓ کپی شد')}
function copyCaption(i){var c=results[i];if(!c)return;cp(c.caption);showToast('✓ کپشن کپی شد')}
function copyAll(i){var c=results[i];if(!c)return;cp(c.slides.map(function(s){return'--- اسلاید '+s.n+' ---\n'+s.content}).join('\n\n')+'\n\n--- کپشن ---\n'+c.caption);showToast('✓ همه کپی شد')}
function back(){document.getElementById('step1').style.display='block';document.getElementById('step23').style.display='none';sel.clear();render();setStep(1);window.scrollTo({top:0,behavior:'smooth'})}
function setStep(n){['s1','s2','s3'].forEach(function(id,i){document.getElementById(id).className='step'+(i+1<n?' done':i+1===n?' active':'')})}
function setLoading(on,text){document.getElementById('loading').className='loading'+(on?' on':'');if(text)document.getElementById('loadTxt').textContent=text}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast on';setTimeout(function(){t.className='toast'},2800)}
function cp(text){if(navigator.clipboard){navigator.clipboard.writeText(text)}else{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}
document.getElementById('apiKey').addEventListener('input',updateBtn)
</script>
</body>
</html>
